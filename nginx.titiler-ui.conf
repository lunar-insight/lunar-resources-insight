# Mounted by docker-compose.titiler-ui.yml into /etc/nginx/conf.d/titiler-ui.conf.
# Included into the port-5173 server block via the wildcard include in nginx.dev.conf.template.
# Remove the override compose file to disable all routes below.
#
# CSP directives verified against live browser console output of /docs and /redoc:
#   fonts.googleapis.com / fonts.gstatic.com : ReDoc loads Montserrat + Roboto
#   fastapi.tiangolo.com                     : FastAPI default favicon
#   cdn.redoc.ly                             : ReDoc logo
#   worker-src blob:                         : ReDoc internal web worker
#   script-src sha256 hash                   : FastAPI inline bootstrap script

location /docs {
    proxy_pass         http://planetcantile:8000/docs;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'sha256-QOOQu4W1oxGqd2nbXbxiA1Di6OHQOLQD+o+G9oWL8YY='; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: blob: https://fastapi.tiangolo.com https://cdn.redoc.ly; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; worker-src blob:; object-src 'none'; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location /redoc {
    proxy_pass         http://planetcantile:8000/redoc;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'sha256-QOOQu4W1oxGqd2nbXbxiA1Di6OHQOLQD+o+G9oWL8YY='; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: blob: https://fastapi.tiangolo.com https://cdn.redoc.ly; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; worker-src blob:; object-src 'none'; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location /openapi.json {
    proxy_pass         http://planetcantile:8000/openapi.json;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
}

# More specific than /cog/ so it takes precedence for the viewer route only.
location /cog/viewer {
    proxy_pass         http://planetcantile:8000/cog/viewer;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'sha256-QOOQu4W1oxGqd2nbXbxiA1Di6OHQOLQD+o+G9oWL8YY='; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: blob: https://fastapi.tiangolo.com https://cdn.redoc.ly; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; worker-src blob:; object-src 'none'; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
}
