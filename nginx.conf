server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Cesium Workers and assets served as-is, no SPA fallback
    location /cesiumStatic/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Hashed JS/CSS chunks from Vite long-lived cache
    location ~* \.(js|css|woff2?|png|jpg|svg|glb|gltf)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
