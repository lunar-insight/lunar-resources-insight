server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Inherited only by locations that set no header of their own, so every location
    # with an add_header repeats these two.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Planetcantile tile server. Header policy is allowlist-only, applied via Lua.
    # Any header not explicitly kept is stripped before reaching the browser.

    # Multi-asset point queries. Routed to the instance that renders no tiles,
    # because tile rendering is CPU bound and holds each worker process's GIL.
    location /stac/point {
        proxy_pass         http://planetcantile-point:8000/stac/point;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;

        proxy_connect_timeout    5s;
        proxy_read_timeout       30s;
        proxy_max_temp_file_size 10m;

        proxy_intercept_errors on;
        error_page 400 401 403 404 500 502 503 504 = @tile_error;

        header_filter_by_lua_block {
            local keep = {
                ["content-type"]      = true,
                ["content-length"]    = true,
                ["content-encoding"]  = true,
                ["content-range"]     = true,
                ["transfer-encoding"] = true,
                ["accept-ranges"]     = true,
                ["cache-control"]     = true,
                ["etag"]              = true,
                ["last-modified"]     = true,
                ["expires"]           = true,
            }
            for k in pairs(ngx.resp.get_headers()) do
                if not keep[k:lower()] then
                    ngx.header[k] = nil
                end
            end
            ngx.header["X-Content-Type-Options"] = "nosniff"
        }
    }

    # Asset keys the point index holds, from a read-only mount of the directory
    # scripts/generate-point-index.mjs writes. The index itself is not served:
    # it names paths inside the tiler container and the browser never reads it.
    location = /point-index/assets.json {
        alias /srv/point-index/assets.json;
        default_type application/json;
        # The keys change whenever the data directory does.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /cog/ {
        proxy_pass         http://planetcantile:8000/cog/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;

        proxy_connect_timeout    5s;
        proxy_read_timeout       30s;
        proxy_max_temp_file_size 10m;

        proxy_intercept_errors on;
        error_page 400 401 403 404 500 502 503 504 = @tile_error;

        header_filter_by_lua_block {
            local keep = {
                ["content-type"]      = true,
                ["content-length"]    = true,
                ["content-encoding"]  = true,
                ["content-range"]     = true,
                ["transfer-encoding"] = true,
                ["accept-ranges"]     = true,
                ["cache-control"]     = true,
                ["etag"]              = true,
                ["last-modified"]     = true,
                ["expires"]           = true,
            }
            for k in pairs(ngx.resp.get_headers()) do
                if not keep[k:lower()] then
                    ngx.header[k] = nil
                end
            end
            ngx.header["X-Content-Type-Options"] = "nosniff"
        }
    }

    location /colorMaps/ {
        proxy_pass         http://planetcantile:8000/colorMaps/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;

        proxy_connect_timeout    5s;
        proxy_read_timeout       10s;
        proxy_max_temp_file_size 1m;

        proxy_intercept_errors on;
        error_page 400 401 403 404 500 502 503 504 = @tile_error;

        header_filter_by_lua_block {
            local keep = {
                ["content-type"]      = true,
                ["content-length"]    = true,
                ["content-encoding"]  = true,
                ["content-range"]     = true,
                ["transfer-encoding"] = true,
                ["accept-ranges"]     = true,
                ["cache-control"]     = true,
                ["etag"]              = true,
                ["last-modified"]     = true,
                ["expires"]           = true,
            }
            for k in pairs(ngx.resp.get_headers()) do
                if not keep[k:lower()] then
                    ngx.header[k] = nil
                end
            end
            ngx.header["X-Content-Type-Options"] = "nosniff"
        }
    }

    location @tile_error {
        default_type application/json;
        return 502 '{"error":"tile service unavailable"}';
    }

    # Cesium terrain (quantized mesh), from a read-only mount of the terrain directory
    # at /srv/static/terrain. Same origin, so the CSP names no terrain host. ^~ keeps
    # the asset regex below from matching terrain paths.
    location ^~ /terrain/ {
        root /srv/static;
        default_type application/octet-stream;
        # Without "always": a missing tile is not cached.
        add_header Cache-Control "public, max-age=31536000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        location ~ \.json$ {
            add_header Cache-Control "public, max-age=300";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }
    }

    # Cesium Workers and assets served as-is, no SPA fallback
    location /cesiumStatic/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Hashed JS/CSS chunks from Vite long-lived cache
    location ~* \.(js|css|woff2?|png|jpg|svg|glb|gltf)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # SPA fallback all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none';" always;
        # Fullscreen and clipboard-write stay at their default (same origin); the app uses both.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), display-capture=(), clipboard-read=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
