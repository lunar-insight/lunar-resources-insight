server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Planetcantile tile server — whitelist-only header policy via Lua.
    # Any header not explicitly kept is stripped before reaching the browser.

    location /cog/ {
        proxy_pass         http://planetcantile:8000/cog/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;

        proxy_connect_timeout    5s;
        proxy_read_timeout       30s;
        proxy_max_temp_file_size 10m;

        proxy_intercept_errors on;
        error_page 400 401 403 404 500 502 503 504 = @tile_error;

        header_filter_by_lua_block {
            local keep = {
                ["content-type"]      = true,
                ["content-length"]    = true,
                ["content-encoding"]  = true,
                ["content-range"]     = true,
                ["transfer-encoding"] = true,
                ["accept-ranges"]     = true,
                ["cache-control"]     = true,
                ["etag"]              = true,
                ["last-modified"]     = true,
                ["expires"]           = true,
            }
            for k in pairs(ngx.resp.get_headers()) do
                if not keep[k:lower()] then
                    ngx.header[k] = nil
                end
            end
            ngx.header["X-Content-Type-Options"] = "nosniff"
        }
    }

    location /colorMaps/ {
        proxy_pass         http://planetcantile:8000/colorMaps/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;

        proxy_connect_timeout    5s;
        proxy_read_timeout       10s;
        proxy_max_temp_file_size 1m;

        proxy_intercept_errors on;
        error_page 400 401 403 404 500 502 503 504 = @tile_error;

        header_filter_by_lua_block {
            local keep = {
                ["content-type"]      = true,
                ["content-length"]    = true,
                ["content-encoding"]  = true,
                ["content-range"]     = true,
                ["transfer-encoding"] = true,
                ["accept-ranges"]     = true,
                ["cache-control"]     = true,
                ["etag"]              = true,
                ["last-modified"]     = true,
                ["expires"]           = true,
            }
            for k in pairs(ngx.resp.get_headers()) do
                if not keep[k:lower()] then
                    ngx.header[k] = nil
                end
            end
            ngx.header["X-Content-Type-Options"] = "nosniff"
        }
    }

    location @tile_error {
        default_type application/json;
        return 502 '{"error":"tile service unavailable"}';
    }

    # Cesium Workers and assets served as-is, no SPA fallback
    location /cesiumStatic/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Hashed JS/CSS chunks from Vite long-lived cache
    location ~* \.(js|css|woff2?|png|jpg|svg|glb|gltf)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; worker-src blob:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    }
}
