<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
  <title>Lunar Resources Insight</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #05070d; min-height: 100vh; font-family: Arial, sans-serif; }
    #loading-overlay {
      position: fixed; inset: 0; width: 100%; height: 100%;
      font-family: Arial, sans-serif;
      background-color: #05070d;
      background-image:
        radial-gradient(circle 1px at 4% 7%, rgba(255,255,255,.65) 0%,transparent 100%),
        radial-gradient(circle 1px at 11% 33%, rgba(255,255,255,.45) 0%,transparent 100%),
        radial-gradient(circle 2px at 16% 55%, rgba(255,255,255,.55) 0%,transparent 100%),
        radial-gradient(circle 1px at 23% 18%, rgba(255,255,255,.40) 0%,transparent 100%),
        radial-gradient(circle 1px at 29% 82%, rgba(255,255,255,.50) 0%,transparent 100%),
        radial-gradient(circle 1px at 35% 43%, rgba(255,255,255,.35) 0%,transparent 100%),
        radial-gradient(circle 2px at 3% 72%, rgba(255,255,255,.60) 0%,transparent 100%),
        radial-gradient(circle 1px at 8% 91%, rgba(255,255,255,.45) 0%,transparent 100%),
        radial-gradient(circle 1px at 42% 12%, rgba(255,255,255,.70) 0%,transparent 100%),
        radial-gradient(circle 1px at 47% 67%, rgba(255,255,255,.40) 0%,transparent 100%),
        radial-gradient(circle 1px at 19% 38%, rgba(255,255,255,.55) 0%,transparent 100%),
        radial-gradient(circle 2px at 6% 48%, rgba(255,255,255,.50) 0%,transparent 100%),
        radial-gradient(circle 1px at 32% 96%, rgba(255,255,255,.65) 0%,transparent 100%),
        radial-gradient(circle 1px at 55% 24%, rgba(255,255,255,.45) 0%,transparent 100%),
        radial-gradient(circle 1px at 14% 77%, rgba(255,255,255,.55) 0%,transparent 100%),
        radial-gradient(circle 2px at 26% 6%, rgba(255,255,255,.70) 0%,transparent 100%),
        radial-gradient(circle 1px at 38% 59%, rgba(255,255,255,.35) 0%,transparent 100%),
        radial-gradient(circle 1px at 52% 88%, rgba(255,255,255,.50) 0%,transparent 100%),
        radial-gradient(circle 1px at 2% 62%, rgba(255,255,255,.60) 0%,transparent 100%),
        radial-gradient(circle 1px at 45% 41%, rgba(255,255,255,.45) 0%,transparent 100%),
        radial-gradient(circle 2px at 22% 84%, rgba(255,255,255,.65) 0%,transparent 100%),
        radial-gradient(circle 1px at 9% 15%, rgba(255,255,255,.50) 0%,transparent 100%),
        radial-gradient(circle 1px at 40% 31%, rgba(255,255,255,.40) 0%,transparent 100%),
        radial-gradient(circle 1px at 57% 53%, rgba(255,255,255,.55) 0%,transparent 100%),
        radial-gradient(circle 1px at 33% 73%, rgba(255,255,255,.35) 0%,transparent 100%),
        radial-gradient(circle 2px at 17% 4%, rgba(255,255,255,.75) 0%,transparent 100%),
        radial-gradient(circle 1px at 50% 77%, rgba(255,255,255,.45) 0%,transparent 100%),
        radial-gradient(circle 1px at 27% 50%, rgba(255,255,255,.55) 0%,transparent 100%),
        radial-gradient(circle 1px at 61% 13%, rgba(255,255,255,.60) 0%,transparent 100%),
        radial-gradient(circle 1px at 48% 95%, rgba(255,255,255,.40) 0%,transparent 100%),
        radial-gradient(circle 1px at 7% 27%, rgba(255,255,255,.55) 0%,transparent 100%),
        radial-gradient(circle 2px at 37% 86%, rgba(255,255,255,.65) 0%,transparent 100%),
        radial-gradient(circle 1px at 53% 44%, rgba(255,255,255,.45) 0%,transparent 100%),
        radial-gradient(circle 1px at 20% 68%, rgba(255,255,255,.50) 0%,transparent 100%),
        radial-gradient(circle 1px at 44% 3%, rgba(255,255,255,.70) 0%,transparent 100%),
        radial-gradient(circle 1px at 59% 72%, rgba(255,255,255,.35) 0%,transparent 100%),
        radial-gradient(circle 2px at 13% 90%, rgba(255,255,255,.60) 0%,transparent 100%),
        radial-gradient(circle 1px at 30% 25%, rgba(255,255,255,.45) 0%,transparent 100%),
        radial-gradient(circle 1px at 64% 36%, rgba(255,255,255,.55) 0%,transparent 100%),
        radial-gradient(circle 1px at 1% 45%, rgba(255,255,255,.40) 0%,transparent 100%);
      z-index: 9999;
      transition: opacity 0.6s ease;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    #loading-stage { position: absolute; inset: 0; }
    #loading-globe { position: absolute; inset: 0; width: 100%; height: 100%; }
    #loading-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #loading-ui {
      position: absolute; inset: 0;
      padding: 56px 64px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    #loading-header { display: flex; align-items: center; gap: 10px; }
    #loading-header img { width: 32px; height: 32px; }
    #loading-header span { color: #e9eee9; font-size: 15px; font-weight: 600; letter-spacing: 0.04em; }
    #loading-bottom { display: flex; flex-direction: column; gap: 6px; max-width: 480px; }
    #loading-headline { color: #e9eee9; font-size: 52px; font-weight: 700; letter-spacing: 0.02em; line-height: 1.2; }
    #loading-subtitle { color: rgba(233,238,233,.55); font-size: 18px; letter-spacing: 0.06em; margin-bottom: 12px; }
    #loading-progress-area { display: flex; flex-direction: column; gap: 6px; }
    #loading-progress-labels { display: flex; justify-content: space-between; align-items: center; }
    #loading-status { color: rgba(233,238,233,.7); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
    #loading-pct { color: rgba(61,169,252,.9); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
    #loading-bar-track { height: 4px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
    #loading-flash {
      position: absolute; inset: 0;
      background: radial-gradient(circle at 62% 50%, rgba(255,247,214,.95), rgba(255,209,92,.45) 38%, transparent 70%);
      opacity: 0; pointer-events: none;
    }
    @font-face {
      font-family: 'Material Symbols Outlined';
      font-style: normal;
      font-weight: 100 700;
      src: url('/symbols/MaterialSymbolsOutlined-Regular.ttf') format('truetype');
      font-display: block;
    }
    @keyframes bar-flow {
      from { background-position: 0 0, 0 0; }
      to   { background-position: 54px 0, 0 0; }
    }
    #progress-bar {
      height: 100%; width: 0%;
      background-image: repeating-linear-gradient(100deg, rgba(255,255,255,0) 0px, rgba(255,255,255,.5) 27px, rgba(255,255,255,0) 54px),
                        linear-gradient(90deg, #3da9fc, #7cc8ff);
      background-size: 54px 100%, 100% 100%;
      border-radius: 2px;
      transition: width 0.35s linear;
      animation: bar-flow 0.5s linear infinite;
    }
  </style>
</head>
<body>
  <noscript>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 Arial,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
  <div id="app"></div>
  <script type="module" src="/src/index.tsx"></script>
  <div id="loading-overlay">
    <div id="loading-flash"></div>
    <div id="loading-stage">
      <svg id="loading-globe" viewBox="0 0 1280 800" preserveAspectRatio="xMaxYMid slice" xmlns="http://www.w3.org/2000/svg"></svg>
      <canvas id="loading-canvas"></canvas>
    </div>
    <div id="loading-ui">
      <div id="loading-header">
        <img src="/images/lunar-resources-insight-logo-background-56x56.png" alt="">
        <span>Lunar Resources Insight</span>
      </div>
      <div id="loading-bottom">
        <div id="loading-headline">Lunar resources, made readable</div>
        <div id="loading-subtitle">Explore, chart, and analyze lunar resources</div>
        <div id="loading-progress-area">
          <div id="loading-progress-labels">
            <span id="loading-status">Initializing</span>
            <span id="loading-pct">0%</span>
          </div>
          <div id="loading-bar-track">
            <div id="progress-bar"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      // ── Material Symbols font preload ──────────────────────────────────────
      if ('FontFace' in window) {
        var msf = new FontFace(
          'Material Symbols Outlined',
          "url('/symbols/MaterialSymbolsOutlined-Regular.ttf')",
          { style: 'normal', weight: '400', display: 'block' }
        );
        document.fonts.add(msf);
        msf.load();
      }

      // ── Phase 1: progress bar animation while React + Cesium load ───────────
      var bar = document.getElementById('progress-bar');
      var pctEl = document.getElementById('loading-pct');
      if (bar) {
        var start = performance.now(), raf;
        // Burst (fast initial rise) + linear (constant 2 %/s thereafter).
        // Rate never drops below 2 %/s so the bar always visibly moves regardless
        // of how long Cesium takes to start firing tile events.
        var BURST_CEIL = 20, BURST_TAU = 1500, LINEAR = 0.002, CAP = 85;
        function tick(now) {
          var e = now - start;
          var p = Math.min(CAP, BURST_CEIL * (1 - Math.exp(-e / BURST_TAU)) + e * LINEAR);
          bar.style.width = p.toFixed(2) + '%';
          if (pctEl) pctEl.textContent = Math.round(p) + '%';
          raf = requestAnimationFrame(tick);
        }
        raf = requestAnimationFrame(tick);
        window.__loadingPhase1Stop = function () {
          cancelAnimationFrame(raf);
          return parseFloat(bar.style.width) || 0;
        };
      }

      // ── Globe and canvas animation ─────
      var SVG_NS = 'http://www.w3.org/2000/svg';
      var cx = 1320, cy = 400, Rg = 520;
      var lat0 = 20 * Math.PI / 180, d = Math.PI / 180;
      var orbits = [
        { a: 600, S: 0.52, R: -12, period: 16, phase: 0 },
        { a: 735, S: 0.50, R:  76, period: 23, phase: 120 },
      ];

      function proj(la, lo) {
        var lat = la * d, lon = lo * d, cosLat = Math.cos(lat);
        var z = Math.sin(lat0) * Math.sin(lat) + Math.cos(lat0) * cosLat * Math.cos(lon);
        return {
          x: cx + Rg * cosLat * Math.sin(lon),
          y: cy - Rg * (Math.cos(lat0) * Math.sin(lat) - Math.sin(lat0) * cosLat * Math.cos(lon)),
          z: z,
        };
      }

      function buildMoon(svg) {
        var defs = document.createElementNS(SVG_NS, 'defs');
        var grad = document.createElementNS(SVG_NS, 'radialGradient');
        grad.id = 'gmoon';
        grad.setAttribute('cx', '34%'); grad.setAttribute('cy', '30%'); grad.setAttribute('r', '85%');
        [['0%', '#171b26'], ['55%', '#0b0e16'], ['100%', '#05070d']].forEach(function(s) {
          var stop = document.createElementNS(SVG_NS, 'stop');
          stop.setAttribute('offset', s[0]); stop.setAttribute('stop-color', s[1]);
          grad.appendChild(stop);
        });
        defs.appendChild(grad);
        svg.appendChild(defs);

        var disc = document.createElementNS(SVG_NS, 'circle');
        disc.setAttribute('cx', cx); disc.setAttribute('cy', cy); disc.setAttribute('r', Rg);
        disc.setAttribute('fill', 'url(#gmoon)');
        svg.appendChild(disc);

        function addLine(pts) {
          if (pts.length < 2) return;
          var poly = document.createElementNS(SVG_NS, 'polyline');
          poly.setAttribute('points', pts.map(function(p) { return p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' '));
          poly.setAttribute('stroke', 'rgba(125,155,205,.16)');
          poly.setAttribute('stroke-width', '1');
          poly.setAttribute('fill', 'none');
          svg.appendChild(poly);
        }

        var lo, la, seg, p;
        for (lo = -160; lo <= 160; lo += 20) {
          seg = [];
          for (la = -90; la <= 90; la += 4) {
            p = proj(la, lo); if (p.z >= 0) seg.push(p); else { addLine(seg); seg = []; }
          }
          addLine(seg);
        }
        for (la = -60; la <= 60; la += 20) {
          seg = [];
          for (lo = -180; lo <= 180; lo += 4) {
            p = proj(la, lo); if (p.z >= 0) seg.push(p); else { addLine(seg); seg = []; }
          }
          addLine(seg);
        }

        var limb = document.createElementNS(SVG_NS, 'circle');
        limb.setAttribute('cx', cx); limb.setAttribute('cy', cy); limb.setAttribute('r', Rg);
        limb.setAttribute('fill', 'none');
        limb.setAttribute('stroke', 'rgba(61,169,252,.30)');
        limb.setAttribute('stroke-width', '1.5');
        svg.appendChild(limb);
      }

      function buildTiles() {
        var sz = 4, gap = 0.84;
        var deep = [40, 108, 214], light = [128, 198, 255];
        function lerp(a, b, t) { return a + (b - a) * t; }
        var tiles = [], la, lo, c, raw, mx, my, r;
        for (la = -84; la < 84; la += sz) {
          for (lo = -180; lo < 180; lo += sz) {
            c = proj(la + sz / 2, lo + sz / 2);
            if (c.z < 0.06) continue;
            raw = [proj(la, lo), proj(la + sz, lo), proj(la + sz, lo + sz), proj(la, lo + sz)];
            if (raw[0].z < 0 || raw[1].z < 0 || raw[2].z < 0 || raw[3].z < 0) continue;
            mx = (raw[0].x + raw[1].x + raw[2].x + raw[3].x) / 4;
            my = (raw[0].y + raw[1].y + raw[2].y + raw[3].y) / 4;
            r = ((Math.sin(la * 12.9898 + lo * 78.233) * 43758.5453) % 1 + 1) % 1;
            tiles.push({
              corners: raw.map(function(p) { return { x: mx + (p.x - mx) * gap, y: my + (p.y - my) * gap }; }),
              ang: Math.acos(Math.min(1, c.z)),
              baseOp: 0.16 + r * 0.30,
              col: [lerp(deep[0], light[0], r) | 0, lerp(deep[1], light[1], r) | 0, lerp(deep[2], light[2], r) | 0],
            });
          }
        }
        return tiles;
      }

      function orbitPoint(o, uDeg) {
        var u = uDeg * d, Rr = o.R * d, sinI = Math.sqrt(1 - o.S * o.S);
        var x1 = o.a * Math.cos(u), y1 = o.a * Math.sin(u) * o.S, z1 = o.a * Math.sin(u) * sinI;
        return { x: cx + x1 * Math.cos(Rr) - y1 * Math.sin(Rr), y: cy + x1 * Math.sin(Rr) + y1 * Math.cos(Rr), z: z1 };
      }

      function drawOrbits(ctx, sc, offX, offY, now, W, H) {
        var span = 104, N = 40, oi, i, j;
        for (oi = 0; oi < orbits.length; oi++) {
          var o = orbits[oi];
          var uh = (now / 1000 / o.period) * 360 + o.phase;
          var pts = [];
          for (i = 0; i <= N; i++) pts.push(orbitPoint(o, uh - span * i / N));
          var head = pts[0];

          var segs = [], segStart = 0, inBack = head.z < 0;
          for (i = 1; i <= N; i++) {
            var back = pts[i].z < 0;
            if (back !== inBack) { segs.push({ start: segStart, end: i, isBack: inBack }); segStart = i; inBack = back; }
          }
          segs.push({ start: segStart, end: N, isBack: inBack });

          function drawSegsFor(drawBack) {
            for (var si = 0; si < segs.length; si++) {
              if (segs[si].isBack !== drawBack) continue;
              for (j = segs[si].start; j < segs[si].end; j++) {
                ctx.beginPath();
                ctx.moveTo(offX + pts[j].x * sc, offY + pts[j].y * sc);
                ctx.lineTo(offX + pts[j + 1].x * sc, offY + pts[j + 1].y * sc);
                ctx.strokeStyle = 'rgba(61,169,252,' + ((1 - j / N) * 0.7).toFixed(3) + ')';
                ctx.lineWidth = 1.5; ctx.stroke();
              }
            }
          }

          ctx.save();
          ctx.beginPath(); ctx.rect(0, 0, W, H);
          ctx.arc(offX + cx * sc, offY + cy * sc, Rg * sc, 0, Math.PI * 2);
          ctx.clip('evenodd');
          drawSegsFor(true);
          ctx.restore();
          drawSegsFor(false);

          var dotX = offX + head.x * sc, dotY = offY + head.y * sc;
          if (head.z < 0) {
            ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H);
            ctx.arc(offX + cx * sc, offY + cy * sc, Rg * sc, 0, Math.PI * 2);
            ctx.clip('evenodd');
          }
          ctx.beginPath(); ctx.arc(dotX, dotY, 10 * sc, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(61,169,252,0.16)'; ctx.fill();
          ctx.beginPath(); ctx.arc(dotX, dotY, 3.2 * sc, 0, Math.PI * 2);
          ctx.fillStyle = '#eaf4ff'; ctx.fill();
          if (head.z < 0) ctx.restore();
        }
      }

      function drawFrame(canvas, tiles, tStart, now, floodStart) {
        var dpr = Math.min(2, window.devicePixelRatio || 1);
        var W = canvas.clientWidth, H = canvas.clientHeight;
        if (!W || !H) return;
        var bw = Math.round(W * dpr), bh = Math.round(H * dpr);
        if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
        var ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, W, H);
        var sc = Math.max(W / 1280, H / 800), offX = W - 1280 * sc, offY = (H - 800 * sc) / 2;

        var interval = 9, waveDur = 2.75, feather = 0.16, flashW = 0.13, tail = 2.30;
        var maxAng = Math.PI / 2, speed = (maxAng + feather) / waveDur;
        var lifetime = (maxAng + feather + tail) / speed;
        var tt = (now - tStart) / 1000, base = Math.floor(tt / interval) * interval;
        var K = Math.ceil(lifetime / interval) + 1, fronts = [], k, age;
        for (k = 0; k <= K; k++) {
          age = tt - (base - k * interval);
          if (age >= 0 && age <= lifetime) fronts.push(age * speed);
        }

        var floodFront = -1;
        if (floodStart > 0) {
          var fAge = (now - floodStart) / 1000;
          if (fAge >= 0 && fAge < 2.6) floodFront = Math.min(fAge / 0.55, 1.25) * (maxAng + feather + 0.2);
        }

        if (fronts.length || floodFront >= 0) {
          ctx.save();
          ctx.beginPath(); ctx.arc(offX + cx * sc, offY + cy * sc, Rg * sc, 0, Math.PI * 2); ctx.clip();
          for (var ti = 0; ti < tiles.length; ti++) {
            var tl = tiles[ti], env = 0, fl = 0, fi, dist, e;
            for (fi = 0; fi < fronts.length; fi++) {
              dist = fronts[fi] - tl.ang;
              if (dist <= 0 || dist >= feather + tail) continue;
              e = dist < feather ? dist / feather : 1 - (dist - feather) / tail;
              if (e > env) { env = e; fl = Math.max(0, 1 - dist / flashW); }
            }
            var op = env * tl.baseOp + fl * 0.34;
            if (floodFront >= 0) {
              var fd = floodFront - tl.ang;
              if (fd > 0) {
                var fenv = Math.min(fd / feather, 1), ffl = Math.max(0, 1 - fd / (flashW * 1.4));
                var fop = fenv * (tl.baseOp * 1.9 + 0.12) + ffl * 0.5;
                if (fop > op) { op = fop; fl = Math.max(fl, ffl); }
              }
            }
            if (op > 0.9) op = 0.9;
            if (op < 0.012) continue;
            var col = tl.col;
            var R = (col[0] + (210 - col[0]) * fl) | 0, G = (col[1] + (236 - col[1]) * fl) | 0, B = (col[2] + (255 - col[2]) * fl) | 0;
            ctx.fillStyle = 'rgba(' + R + ',' + G + ',' + B + ',' + op.toFixed(3) + ')';
            var cr = tl.corners;
            ctx.beginPath();
            ctx.moveTo(offX + cr[0].x * sc, offY + cr[0].y * sc);
            ctx.lineTo(offX + cr[1].x * sc, offY + cr[1].y * sc);
            ctx.lineTo(offX + cr[2].x * sc, offY + cr[2].y * sc);
            ctx.lineTo(offX + cr[3].x * sc, offY + cr[3].y * sc);
            ctx.closePath(); ctx.fill();
          }
          ctx.restore();
        }
        drawOrbits(ctx, sc, offX, offY, now, W, H);
      }

      var tiles = [], canvasStart = performance.now(), floodStart = 0, lastFrameTime = 0, canvasRaf = 0;
      var canvasEl = document.getElementById('loading-canvas');
      var svgEl = document.getElementById('loading-globe');

      function canvasLoop(now) {
        canvasRaf = requestAnimationFrame(canvasLoop);
        if (now - lastFrameTime < 33) return;
        lastFrameTime = now;
        if (canvasEl) drawFrame(canvasEl, tiles, canvasStart, now, floodStart);
      }

      try { if (svgEl) buildMoon(svgEl); } catch (e) {}
      canvasRaf = requestAnimationFrame(canvasLoop);
      if ('requestIdleCallback' in window) {
        requestIdleCallback(function() { tiles = buildTiles(); }, { timeout: 2000 });
      } else {
        setTimeout(function() { tiles = buildTiles(); }, 0);
      }

      window.__loadingGlobeBuilt = true;
      window.__loadingSetFloodStart = function(ts) { floodStart = ts; };
      window.__loadingCancelCanvas = function() { cancelAnimationFrame(canvasRaf); canvasRaf = 0; };
    })();
  </script>
</body>
</html>
